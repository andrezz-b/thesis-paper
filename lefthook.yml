pre-commit:
  jobs:
    - name: fmt
      glob: "*.tex"
      run: mise x -- tex-fmt {staged_files}
      stage_fixed: true
    - group:
        parallel: true
        jobs:
          - name: lint
            glob: "*.tex"
            run: mise x -- chktex -q {staged_files} || true
          - name: spell
            run: mise x -- typos --force-exclude {staged_files}
          - name: docs
            run: mise run questions:check
          - name: literature
            run: mise run lit:check
